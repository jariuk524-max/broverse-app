    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bg)"/>
  <circle cx="60" cy="52" r="54" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="268" cy="172" r="60" fill="#FFFFFF" opacity="0.18"/>
  <!-- труба из стены -->
  <rect x="0" y="66" width="70" height="22" rx="8" fill="url(#metal)"/>
  <rect x="58" y="60" width="18" height="34" rx="6" fill="#64748B"/>
  <!-- кран -->
  <rect x="66" y="70" width="112" height="18" rx="9" fill="url(#metal)"/>
  <rect x="162" y="70" width="18" height="52" rx="9" fill="url(#metal)"/>
  <!-- вентиль -->
  <rect x="88" y="46" width="14" height="26" rx="5" fill="#0EA5E9"/>
  <rect x="74" y="40" width="42" height="12" rx="6" fill="#0284C7"/>
  <!-- струя воды -->
  <rect x="165" y="122" width="12" height="34" rx="6" fill="url(#water)" opacity="0.9"/>
  <!-- лужа -->
  <ellipse cx="171" cy="176" rx="52" ry="14" fill="#38BDF8" opacity="0.55"/>
  <ellipse cx="171" cy="173" rx="34" ry="9" fill="#7DD3FC" opacity="0.8"/>
  <!-- капли -->
  <circle cx="150" cy="132" r="6" fill="#38BDF8"/>
