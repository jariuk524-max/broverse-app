  <!-- гаечный ключ -->
  <g transform="translate(232 84) rotate(24)">
    <rect x="0" y="8" width="64" height="13" rx="6" fill="#64748B"/>
    <path d="M0 14 a17 17 0 1 1 20 14 l-4 -7 a10 10 0 1 0 -8 -8 z" fill="#475569"/>
