  <rect x="74" y="66" width="106" height="56" rx="9" fill="url(#carton2)"/>
  <rect x="74" y="66" width="106" height="15" rx="7" fill="#FDE68A"/>
  <rect x="118" y="66" width="17" height="56" fill="#FEF3C7" opacity="0.9"/>
  <!-- верхняя коробка -->
  <rect x="172" y="42" width="86" height="74" rx="9" fill="#D97706"/>
