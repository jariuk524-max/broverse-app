      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="carton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="carton2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bg)"/>
  <circle cx="264" cy="52" r="58" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="48" cy="176" r="66" fill="#FFFFFF" opacity="0.2"/>
  <!-- нижняя коробка -->
  <rect x="96" y="118" width="132" height="82" rx="10" fill="url(#carton)"/>
  <rect x="96" y="118" width="132" height="20" rx="8" fill="#FCD34D"/>
  <rect x="152" y="118" width="20" height="82" fill="#FDE68A" opacity="0.85"/>
