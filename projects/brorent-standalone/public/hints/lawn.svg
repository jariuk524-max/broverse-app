<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Стрижка газона">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0FDF4"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="mower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bg)"/>
  <circle cx="266" cy="46" r="52" fill="#FDE047" opacity="0.85"/>
  <circle cx="52" cy="60" r="26" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="76" cy="56" r="20" fill="#FFFFFF" opacity="0.9"/>
  <!-- газон -->
  <rect x="0" y="140" width="320" height="80" fill="url(#lawn)" rx="0"/>
  <path d="M0 140 h64 v80 h-64 z" fill="#22C55E" opacity="0.55"/>
  <path d="M128 140 h64 v80 h-64 z" fill="#22C55E" opacity="0.55"/>
  <path d="M256 140 h64 v80 h-64 z" fill="#22C55E" opacity="0.55"/>
  <!-- травинки -->
  <g stroke="#15803D" stroke-width="4" stroke-linecap="round">
    <path d="M30 138 v-16"/>
    <path d="M40 138 v-22"/>
    <path d="M50 138 v-14"/>
    <path d="M282 138 v-18"/>
    <path d="M292 138 v-24"/>
    <path d="M302 138 v-15"/>
  </g>
  <!-- газонокосилка -->
  <rect x="96" y="96" width="112" height="34" rx="12" fill="url(#mower)"/>
  <rect x="186" y="84" width="10" height="34" rx="5" fill="#64748B"/>
  <path d="M196 86 h30" stroke="#64748B" stroke-width="9" stroke-linecap="round"/>
  <rect x="90" y="118" width="124" height="14" rx="7" fill="#1E40AF"/>
  <circle cx="112" cy="136" r="14" fill="#1E293B"/>
  <circle cx="112" cy="136" r="6" fill="#94A3B8"/>
  <circle cx="196" cy="136" r="14" fill="#1E293B"/>
  <circle cx="196" cy="136" r="6" fill="#94A3B8"/>
  <!-- скошенная полоса перед косилкой -->
  <rect x="220" y="140" width="44" height="80" fill="#86EFAC" opacity="0.5"/>
</svg>
