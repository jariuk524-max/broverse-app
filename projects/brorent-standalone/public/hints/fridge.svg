<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Ремонт холодильника">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bg)"/>
  <circle cx="52" cy="48" r="54" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="272" cy="180" r="60" fill="#FFFFFF" opacity="0.18"/>
  <!-- холодильник -->
  <rect x="102" y="24" width="116" height="172" rx="14" fill="url(#body)" stroke="#94A3B8" stroke-width="3"/>
  <rect x="102" y="86" width="116" height="6" fill="#94A3B8"/>
  <!-- ручки -->
  <rect x="198" y="50" width="8" height="26" rx="4" fill="#64748B"/>
  <rect x="198" y="102" width="8" height="34" rx="4" fill="#64748B"/>
  <!-- снежинка -->
  <g stroke="#0EA5E9" stroke-width="5" stroke-linecap="round">
    <line x1="144" y1="46" x2="144" y2="74"/>
    <line x1="132" y1="53" x2="156" y2="67"/>
    <line x1="156" y1="53" x2="132" y2="67"/>
  </g>
  <!-- иней на морозилке -->
  <path d="M116 118 l6 14 14 6 -14 6 -6 14 -6-14 -14-6 14-6z" fill="#FFFFFF" opacity="0.9"/>
  <!-- температура -->
  <rect x="122" y="132" width="44" height="16" rx="8" fill="#DBEAFE"/>
  <text x="144" y="144" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D4ED8" text-anchor="middle">-18°</text>
  <!-- компрессор-шестерёнка -->
  <circle cx="248" cy="150" r="18" fill="#F59E0B"/>
  <circle cx="248" cy="150" r="7" fill="#FFFFFF"/>
  <g fill="#F59E0B">
    <rect x="244" y="126" width="8" height="10" rx="2"/>
    <rect x="244" y="164" width="8" height="10" rx="2"/>
    <rect x="224" y="146" width="10" height="8" rx="2"/>
    <rect x="262" y="146" width="10" height="8" rx="2"/>
  </g>
</svg>
