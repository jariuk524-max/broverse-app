<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Мастер на час">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bg)"/>
  <circle cx="270" cy="48" r="56" fill="#FFFFFF" opacity="0.28"/>
  <circle cx="46" cy="180" r="62" fill="#FFFFFF" opacity="0.2"/>
  <!-- ручка ящика -->
  <path d="M112 76 q48 -30 96 0" stroke="#7F1D1D" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- корпус ящика -->
  <rect x="56" y="88" width="208" height="94" rx="14" fill="url(#box)"/>
  <rect x="56" y="118" width="208" height="12" fill="#7F1D1D"/>
  <rect x="138" y="114" width="44" height="20" rx="6" fill="#FDE68A"/>
  <rect x="146" y="120" width="28" height="6" rx="3" fill="#B45309"/>
  <!-- отвёртка -->
  <g transform="translate(74 44) rotate(-18)">
    <rect x="0" y="8" width="56" height="9" rx="4" fill="url(#metal)"/>
    <rect x="54" y="6" width="18" height="13" rx="3" fill="#F97316"/>
    <rect x="68" y="9" width="10" height="7" rx="2" fill="#EA580C"/>
  </g>
  <!-- молоток -->
  <g transform="translate(196 40) rotate(14)">
    <rect x="14" y="14" width="58" height="10" rx="5" fill="#A16207"/>
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#64748B"/>
    <rect x="4" y="6" width="22" height="8" rx="3" fill="#CBD5E1"/>
  </g>
</svg>
