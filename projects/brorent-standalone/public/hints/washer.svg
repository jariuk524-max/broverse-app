    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bg)"/>
  <circle cx="276" cy="46" r="56" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="44" cy="176" r="60" fill="#FFFFFF" opacity="0.18"/>
  <!-- корпус -->
  <rect x="78" y="34" width="164" height="156" rx="16" fill="url(#body)" stroke="#94A3B8" stroke-width="3"/>
  <!-- панель управления -->
  <rect x="90" y="46" width="140" height="30" rx="8" fill="#E2E8F0"/>
  <circle cx="112" cy="61" r="8" fill="#EF4444"/>
  <rect x="130" y="56" width="52" height="10" rx="5" fill="#94A3B8"/>
  <circle cx="214" cy="61" r="7" fill="#34A853"/>
  <!-- люк -->
  <circle cx="160" cy="132" r="46" fill="#E2E8F0"/>
  <circle cx="160" cy="132" r="36" fill="url(#door)"/>
  <path d="M132 128 q14 -12 28 0 t28 0" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M132 144 q14 -12 28 0 t28 0" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <circle cx="146" cy="118" r="6" fill="#FFFFFF" opacity="0.5"/>
  <!-- пузырьки -->
  <circle cx="258" cy="120" r="8" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="272" cy="98" r="5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="56" cy="126" r="7" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="46" cy="104" r="4" fill="#FFFFFF" opacity="0.55"/>
